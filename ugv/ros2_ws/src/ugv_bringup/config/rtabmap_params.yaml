# RTAB-Map VSLAM parameters for UGV RGB-D bring-up
# ROS 2 Jazzy / Ubuntu 24.04
# Hardware: Intel RealSense D4xx (depth aligned via realsense2_camera driver)
#
# All three node namespaces must be kept in sync:
#   rgbd_sync      – sensor synchronisation (rtabmap_sync)
#   rgbd_odometry  – visual odometry        (rtabmap_odom)
#   rtabmap        – SLAM back-end          (rtabmap_slam)

# ---------------------------------------------------------------------------
# RGB-D Sync node  (package: rtabmap_sync, executable: rgbd_sync)
# ---------------------------------------------------------------------------
rgbd_sync:
  ros__parameters:
    # Approximate time synchronisation – required because RealSense colour
    # and depth streams have slightly different timestamps.
    approx_sync: true
    approx_sync_max_interval: 0.02        # seconds; keep <= one frame period

    # QoS: 2 = sensor_data (Best Effort) matches realsense2_camera defaults.
    qos: 2

    # Queue depth for the approximate sync policy.
    queue_size: 10

    publish_rgbd: false                   # false -> individual topics forwarded

# ---------------------------------------------------------------------------
# RGB-D Odometry node  (package: rtabmap_odom, executable: rgbd_odometry)
# ---------------------------------------------------------------------------
rgbd_odometry:
  ros__parameters:
    # Coordinate frames
    frame_id:         "base_link"         # robot body frame
    odom_frame_id:    "odom"              # visual odometry frame
    publish_tf:       true                # broadcast odom -> base_link TF

    # Sensor input
    subscribe_depth:     true
    subscribe_odom_info: true

    # Sync policy – must match rgbd_sync above
    approx_sync: true
    queue_size:  10
    qos:         2                        # sensor_data / Best Effort

    # Visual feature settings
    Vis/MinInliers:     "10"              # min feature matches for valid frame
    Vis/InlierDistance: "0.1"            # RANSAC inlier threshold (m)

    # Odometry robustness
    Odom/Strategy:       "0"             # 0 = Frame-to-Map (F2M), robust
    Odom/ResetCountdown: "0"             # never auto-reset
    Odom/GuessMotion:    "true"          # use previous motion as initial guess

    publish_null_when_lost: true

# ---------------------------------------------------------------------------
# RTAB-Map SLAM node  (package: rtabmap_slam, executable: rtabmap)
# ---------------------------------------------------------------------------
rtabmap:
  ros__parameters:
    # Coordinate frames
    frame_id:      "base_link"
    odom_frame_id: "odom"
    map_frame_id:  "map"
    publish_tf:    true                   # broadcast map -> odom TF

    # Sensor input mode
    subscribe_depth:  true
    subscribe_rgbd:   false
    subscribe_scan:   false

    # Sync policy
    approx_sync: true
    queue_size:  10
    qos:         2                        # sensor_data / Best Effort

    # Loop closure & graph optimisation
    RGBD/NeighborLinkRefining: "false"   # no lidar, keep false
    RGBD/ProximityBySpace:     "true"
    RGBD/ProximityByTime:      "false"
    RGBD/OptimizeFromGraphEnd: "false"   # keep map->odom stable
    RGBD/OptimizeMaxError:     "4"

    # Map building
    Mem/STMSize:    "30"                  # short-term memory size
    Grid/FromDepth: "true"               # build occupancy from depth

    # Visual matching
    Vis/MinInliers: "10"
    Reg/Strategy:   "0"                  # 0 = visual registration

    # Database – store in a predictable location
    database_path: "~/.ros/rtabmap.db"
