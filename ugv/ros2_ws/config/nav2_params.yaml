nav2_params:
  # Navigation behavior parameters
  bt_navigator:
    ros__parameters:
      default_bt_xml_filename: "navigate_w_replanning.xml"
      plugin_lib_names:
        - nav2_compute_path_to_pose_action_bt_node
        - nav2_follow_path_action_bt_node
        - nav2_spin_action_bt_node
        - nav2_wait_action_bt_node
        - nav2_assisted_teleop_action_bt_node

  controller_server:
    ros__parameters:
      use_mutex: true
      controller_frequency: 20.0
      min_x_velocity_threshold: 0.001
      min_y_velocity_threshold: 0.5
      min_theta_velocity_threshold: 0.001
      failure_tolerance: 0.3
      progress_checker_plugin: "progress_checker"
      goal_checker_plugins: ["general_goal_checker"]
      controller_plugins: ["FollowPath"]

      progress_checker:
        plugin: "nav2_controller::SimpleProgressChecker"
        required_movement_radius: 0.5
        movement_time_allowance: 10.0

      general_goal_checker:
        stateful: true
        plugin: "nav2_controller::SimpleGoalChecker"
        xy_goal_tolerance: 0.25
        yaw_goal_tolerance: 0.25

      FollowPath:
        plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
        desired_linear_vel: 0.6
        max_linear_vel: 1.0
        min_approach_linear_vel: 0.05
        lookahead_dist: 0.7
        approach_velocity_scaling_dist: 0.6
        max_allowed_time_error_to_skip: 1.0
        use_velocity_commands: true
        angular_tolerance: 0.35
        lookahead_time: 1.0

      # Ackermann-specific motion limits (local planner output still Twist)
      # Convert cmd_vel -> steering commands in your hardware interface node.
      ackermann:
        wheel_base: 0.45
        max_steering_angle: 0.6
        max_steering_rate: 0.7
        max_velocity: 1.0
        min_velocity: 0.0

  # Bluetooth command interface
  bluetooth_command_listener:
    ros__parameters:
      port: "/dev/ttyUSB0"  # Adjust based on your Bluetooth connection
      baudrate: 115200
      timeout: 1.0
      command_topic: "/bluetooth_commands"
      enable_remote_control: true

  # Pixhawk 4 integration
  pixhawk_interface:
    ros__parameters:
      gps_topic: "/mavros/global_position/global"
      imu_topic: "/mavros/imu/data"
      odometry_topic: "/odometry/local"
      arming_service: "/mavros/cmd/arming"

  # Orange Cube+ specific parameters
  platform:
    ros__parameters:
      platform_type: "ugv"
      max_linear_velocity: 1.0
      max_angular_velocity: 2.0
      wheel_radius: 0.05
      wheel_separation: 0.3